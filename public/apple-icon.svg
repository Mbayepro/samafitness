<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="apple-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="apple-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#apple-bg)"/>

  <!-- Athletic Dumbbell -->
  <g transform="translate(90, 75)">
    <rect x="-42" y="-5" width="84" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
    <!-- Left weights -->
    <rect x="-54" y="-24" width="10" height="48" rx="3" fill="url(#apple-lime)"/>
    <rect x="-64" y="-18" width="8" height="36" rx="2" fill="#d4d4d4"/>
    <!-- Right weights -->
    <rect x="44" y="-24" width="10" height="48" rx="3" fill="url(#apple-lime)"/>
    <rect x="56" y="-18" width="8" height="36" rx="2" fill="#d4d4d4"/>
    <!-- Center badge -->
    <circle cx="0" cy="0" r="22" fill="#080808" stroke="url(#apple-lime)" stroke-width="2.5"/>
    <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">SF</text>
  </g>

  <text x="90" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    SAMBA<tspan fill="#a3e635">FIT</tspan>
  </text>
</svg>
